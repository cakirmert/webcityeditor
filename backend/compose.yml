services:
  projects:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8789:8789"
    environment:
      PROJECTS_TOKEN: ${PROJECTS_TOKEN:?Set PROJECTS_TOKEN in backend/.env}
      PROJECTS_ALLOWED_ORIGINS: ${PROJECTS_ALLOWED_ORIGINS:-https://cakirmert.github.io,http://127.0.0.1:5173,http://localhost:5173}
      PROJECTS_MAX_BYTES: ${PROJECTS_MAX_BYTES:-67108864}
      PROJECTS_HISTORY_LIMIT: ${PROJECTS_HISTORY_LIMIT:-20}
    volumes:
      - projects-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  projects-data:
